<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testbench</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; color: #172554; }
    main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #c7d2fe; border-radius: 1rem; background: white; box-shadow: 0 1rem 2rem #312e811a; }
    h1 { margin-top: 0; }
    button { border: 0; border-radius: .5rem; padding: .7rem 1rem; background: #4f46e5; color: white; cursor: pointer; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Testbench</h1>
    <p>A real browser-rendered smoke page.</p>
    <button id="run" type="button">Run check</button>
    <p id="status" role="status">Ready</p>
  </main>
  <script>
    document.querySelector('#run').addEventListener('click', () => {
      document.querySelector('#status').textContent = 'Check passed';
    });
  </script>
</body>
</html>
